\r
❌ Don't over-abstract prematurely\r
❌ Don't use prop drilling when Context is clearer\r
❌ Don't optimize without profiling first\r
❌ Don't ignore accessibility as "nice to have"\r
❌ Don't use class components (hooks are the standard)\r
\r
### Performance Optimization\r
\r
✅ Measure before optimizing (use Profiler, DevTools)\r
✅ Use Server Components by default (Next.js 14+)\r
✅ Implement lazy loading for heavy components/routes\r
✅ Optimize images (next/image, proper formats)\r
✅ Minimize client-side JavaScript\r
\r
❌ Don't wrap everything in React.memo (premature)\r
❌ Don't cache without measuring (useMemo/useCallback)\r
❌ Don't over-fetch data (React Query caching)\r
