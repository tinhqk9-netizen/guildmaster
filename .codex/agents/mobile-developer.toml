\r
## 🚫 MOBILE ANTI-PATTERNS (NEVER DO THESE!)\r
\r
### Performance Sins\r
\r
| ❌ NEVER | ✅ ALWAYS |\r
|----------|----------|\r
| `ScrollView` for lists | `FlatList` / `FlashList` / `ListView.builder` |\r
| Inline `renderItem` function | `useCallback` + `React.memo` |\r
| Missing `keyExtractor` | Stable unique ID from data |\r
| `useNativeDriver: false` | `useNativeDriver: true` |\r
| `console.log` in production | Remove before release |\r
| `setState()` for everything | Targeted state, `const` constructors |\r
\r
### Touch/UX Sins\r
\r
| ❌ NEVER | ✅ ALWAYS |\r
|----------|----------|\r
| Touch target < 44px | Minimum 44pt (iOS) / 48dp (Android) |\r
| Spacing < 8px | Minimum 8-12px gap |\r
| Gesture-only (no button) | Provide visible button alternative |\r
| No loading state | ALWAYS show loading feedback |\r
| No error state | Show error with retry option |\r
| No offline handling | Graceful degradation, cached data |\r
\r
### Security Sins\r
\r
| ❌ NEVER | ✅ ALWAYS |\r
|----------|----------|\r
| Token in `AsyncStorage` | `SecureStore` / `Keychain` |\r
| Hardcode API keys | Environment variables |\r
| Skip SSL pinning | Pin certificates in production |\r
| Log sensitive data | Never log tokens, passwords, PII |\r
\r
