## 🔴 BUILD VERIFICATION (MANDATORY Before "Done")\r
\r
> **⛔ You CANNOT declare a mobile project "complete" without running actual builds!**\r
\r
### Why This Is Non-Negotiable\r
\r
```\r
AI writes code → "Looks good" → User opens Android Studio → BUILD ERRORS!\r
This is UNACCEPTABLE.\r
\r
AI MUST:\r
├── Run the actual build command\r
├── See if it compiles\r
├── Fix any errors\r
└── ONLY THEN say "done"\r
```\r
\r
### 📱 Emulator Quick Commands (All Platforms)\r
\r
**Android SDK Paths by OS:**\r
\r
| OS | Default SDK Path | Emulator Path |\r
|----|------------------|---------------|\r
| **Windows** | `%LOCALAPPDATA%\\Android\\Sdk` | `emulator\\emulator.exe` |\r
| **macOS** | `~/Library/Android/sdk` | `emulator/emulator` |\r
| **Linux** | `~/Android/Sdk` | `emulator/emulator` |\r
\r
**Commands by Platform:**\r
\r
```powershell\r
# === WINDOWS (PowerShell) ===\r
# List emulators\r
& "$env:LOCALAPPDATA\\Android\\Sdk\\emulator\\emulator.exe" -list-avds\r
\r
# Start emulator\r
& "$env:LOCALAPPDATA\\Android\\Sdk\\emulator\\emulator.exe" -avd "<AVD_NAME>"\r
\r
# Check devices\r
& "$env:LOCALAPPDATA\\Android\\Sdk\\platform-tools\\adb.exe" devices\r
```\r
\r
```bash\r
# === macOS / Linux (Bash) ===\r
# List emulators\r
~/Library/Android/sdk/emulator/emulator -list-avds   # macOS\r
~/Android/Sdk/emulator/emulator -list-avds           # Linux\r
\r
# Start emulator\r
emulator -avd "<AVD_NAME>"\r
\r
# Check devices\r
adb devices\r
```\r
\r
> 🔴 **DO NOT search randomly. Use these exact paths based on user's OS!**\r
\r
### Build Commands by Framework\r
\r
| Framework | Android Build | iOS Build |\r
|-----------|---------------|-----------|\r
| **React Native (Bare)** | `cd android && ./gradlew assembleDebug` | `cd ios && xcodebuild -workspace App.xcworkspace -scheme App` |\r
| **Expo (Dev)** | `npx expo run:android` | `npx expo run:ios` |\r
| **Expo (EAS)** | `eas build --platform android --profile preview` | `eas build --platform ios --profile preview` |\r
| **Flutter** | `flutter build apk --debug` | `flutter build ios --debug` |\r
\r
### What to Check After Build\r
\r
```\r
BUILD OUTPUT:\r
├── ✅ BUILD SUCCESSFUL → Proceed\r
├── ❌ BUILD FAILED → FIX before continuing\r
│   ├── Read error message\r
│   ├── Fix the issue\r
│   ├── Re-run build\r
│   └── Repeat until success\r
└── ⚠️ WARNINGS → Review, fix if critical\r
```\r
\r
### Common Build Errors to Watch For\r
\r
| Error Type | Cause | Fix |\r
|------------|-------|-----|\r
| **Gradle sync failed** | Dependency version mismatch | Check `build.gradle`, sync versions |\r
| **Pod install failed** | iOS dependency issue | `cd ios && pod install --repo-update` |\r
| **TypeScript errors** | Type mismatches | Fix type definitions |\r
| **Missing imports** | Auto-import failed | Add missing imports |\r
| **Android SDK version** | `minSdkVersion` too low | Update in `build.gradle` |\r
| **iOS deployment target** | Version mismatch | Update in Xcode/Podfile |\r
\r
### Mandatory Build Checklist\r
\r
Before saying "project complete":\r
\r
- [ ] **Android build runs without errors** (`./gradlew assembleDebug` or equivalent)\r
- [ ] **iOS build runs without errors** (if cross-platform)\r
- [ ] **App launches on device/emulator**\r
- [ ] **No console errors on launch**\r
- [ ] **Critical flows work** (navigation, main features)\r
\r
> 🔴 **If you skip build verification and user finds build errors, you have FAILED.**\r
> 🔴 **"It works in my head" is NOT verification. RUN THE BUILD.**\r
\r
---\r
\r
> **Remember:** Mobile users are impatient, interrupted, and using imprecise fingers on small screens. Design for the WORST conditions: bad network, one hand, bright sun, low battery. If it works there, it works everywhere."""
