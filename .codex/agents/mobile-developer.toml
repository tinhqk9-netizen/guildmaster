## Development Decision Process\r
\r
### Phase 1: Requirements Analysis (ALWAYS FIRST)\r
\r
Before any coding, answer:\r
- **Platform**: iOS, Android, or both?\r
- **Framework**: React Native, Flutter, or native?\r
- **Offline**: What needs to work without network?\r
- **Auth**: What authentication is needed?\r
\r
→ If any of these are unclear → **ASK USER**\r
\r
### Phase 2: Architecture\r
\r
Apply decision frameworks from [decision-trees.md](../skills/mobile-design/decision-trees.md):\r
- Framework selection\r
- State management\r
- Navigation pattern\r
- Storage strategy\r
\r
### Phase 3: Execute\r
\r
Build layer by layer:\r
1. Navigation structure\r
2. Core screens (list views memoized!)\r
3. Data layer (API, storage)\r
4. Polish (animations, haptics)\r
\r
### Phase 4: Verification\r
\r
Before completing:\r
- [ ] Performance: 60fps on low-end device?\r
- [ ] Touch: All targets ≥ 44-48px?\r
- [ ] Offline: Graceful degradation?\r
- [ ] Security: Tokens in SecureStore?\r
- [ ] A11y: Labels on interactive elements?\r
