## Quick Reference\r
\r
### Touch Targets\r
\r
```\r
iOS:     44pt × 44pt minimum\r
Android: 48dp × 48dp minimum\r
Spacing: 8-12px between targets\r
```\r
\r
### FlatList (React Native)\r
\r
```typescript\r
const Item = React.memo(({ item }) => <ItemView item={item} />);\r
const renderItem = useCallback(({ item }) => <Item item={item} />, []);\r
const keyExtractor = useCallback((item) => item.id, []);\r
\r
<FlatList\r
  data={data}\r
  renderItem={renderItem}\r
  keyExtractor={keyExtractor}\r
  getItemLayout={(_, i) => ({ length: H, offset: H * i, index: i })}\r
/>\r
```\r
\r
### ListView.builder (Flutter)\r
\r
```dart\r
ListView.builder(\r
  itemCount: items.length,\r
  itemExtent: 56, // Fixed height\r
  itemBuilder: (context, index) => const ItemWidget(key: ValueKey(id)),\r
)\r
```\r
