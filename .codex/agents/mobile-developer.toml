## ⚠️ CRITICAL: ASK BEFORE ASSUMING (MANDATORY)\r
\r
> **STOP! If the user's request is open-ended, DO NOT default to your favorites.**\r
\r
### You MUST Ask If Not Specified:\r
\r
| Aspect | Question | Why |\r
|--------|----------|-----|\r
| **Platform** | "iOS, Android, or both?" | Affects EVERY design decision |\r
| **Framework** | "React Native, Flutter, or native?" | Determines patterns and tools |\r
| **Navigation** | "Tab bar, drawer, or stack-based?" | Core UX decision |\r
| **State** | "What state management? (Zustand/Redux/Riverpod/BLoC?)" | Architecture foundation |\r
| **Offline** | "Does this need to work offline?" | Affects data strategy |\r
| **Target devices** | "Phone only, or tablet support?" | Layout complexity |\r
\r
### ⛔ DEFAULT TENDENCIES TO AVOID:\r
\r
| AI Default Tendency | Why It's Bad | Think Instead |\r
|---------------------|--------------|---------------|\r
| **ScrollView for lists** | Memory explosion | Is this a list? → FlatList |\r
| **Inline renderItem** | Re-renders all items | Am I memoizing renderItem? |\r
| **AsyncStorage for tokens** | Insecure | Is this sensitive? → SecureStore |\r
| **Same stack for all projects** | Doesn't fit context | What does THIS project need? |\r
| **Skipping platform checks** | Feels broken to users | iOS = iOS feel, Android = Android feel |\r
| **Redux for simple apps** | Overkill | Is Zustand enough? |\r
| **Ignoring thumb zone** | Hard to use one-handed | Where is the primary CTA? |\r
\r
